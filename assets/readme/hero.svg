<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Shanghai Afterglow · 城市晚霞版画档案 — City Pop 上海与北京探索</title>
  <desc id="desc">深紫夜空底标题：Shanghai Afterglow 城市晚霞版画档案，副标题把昭和 City Pop 画进上海与北京；右侧是条纹落日与陆家嘴天际线剪影。</desc>

  <g id="bg">
    <rect width="1200" height="360" rx="26" fill="#150826"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#f27059">CITY POP · PROMPT ARCHIVE · 1980s 昭和美学</text>
    <text x="56" y="130" font-size="56" font-weight="700" fill="#f8fafc">Shanghai Afterglow</text>
    <text x="56" y="172" font-size="23" fill="#f2d484">城市晚霞版画档案 — 把昭和 City Pop 画进上海与北京</text>
    <text x="56" y="208" font-size="19" fill="#b8a8cc">同一机位、同一地标，六轮提示词实验，拆解晚霞、颗粒与天际线。</text>
    <g id="chips" font-size="18" fill="#e7edf3" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#221238" stroke="#4a2d68" stroke-width="1.5"/><text x="119" y="262">46 幅作品</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#221238" stroke="#4a2d68" stroke-width="1.5"/><text x="257" y="262">45 条提示词</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#221238" stroke="#4a2d68" stroke-width="1.5"/><text x="395" y="262">6 轮探索</text></g>
      <g><rect x="470" y="238" width="150" height="36" rx="18" fill="#221238" stroke="#4a2d68" stroke-width="1.5"/><text x="545" y="262">上海 × 北京</text></g>
    </g>
  </g>

  <g id="sunset">
    <g id="sun">
      <circle cx="930" cy="168" r="104" fill="#f27059"/>
      <circle cx="930" cy="168" r="76" fill="#f2a65a"/>
      <circle cx="930" cy="168" r="48" fill="#f2d484"/>
    </g>
    <g id="sun-stripes" fill="#150826">
      <rect x="812" y="150" width="236" height="7"/>
      <rect x="812" y="172" width="236" height="9"/>
      <rect x="812" y="196" width="236" height="12"/>
      <rect x="812" y="222" width="236" height="15"/>
    </g>
    <g id="skyline" fill="#0d0a1f">
      <rect x="800" y="196" width="26" height="96"/>
      <rect x="834" y="168" width="20" height="124"/>
      <rect x="860" y="210" width="34" height="82"/>
      <rect x="902" y="140" width="16" height="152"/>
      <rect x="902" y="128" width="4" height="16"/>
      <rect x="926" y="182" width="28" height="110"/>
      <rect x="962" y="156" width="22" height="136"/>
      <rect x="992" y="204" width="30" height="88"/>
      <rect x="1030" y="176" width="20" height="116"/>
      <rect x="1058" y="220" width="34" height="72"/>
    </g>
    <g id="water" fill="#150826">
      <rect x="760" y="292" width="340" height="68"/>
    </g>
    <g id="water-lines" stroke-width="3" stroke-linecap="round">
      <line x1="800" y1="306" x2="900" y2="306" stroke="#f27059"/>
      <line x1="930" y1="306" x2="1060" y2="306" stroke="#f2a65a"/>
      <line x1="830" y1="324" x2="980" y2="324" stroke="#f2a65a"/>
      <line x1="1010" y1="324" x2="1080" y2="324" stroke="#f27059"/>
      <line x1="790" y1="342" x2="880" y2="342" stroke="#f2d484"/>
      <line x1="910" y1="342" x2="1040" y2="342" stroke="#f27059"/>
    </g>
  </g>
</svg>
